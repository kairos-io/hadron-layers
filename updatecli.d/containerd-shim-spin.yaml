---
name: containerd-shim-spin layer version updates

sources:
  spin_shim:
    # The Dockerfile downloads release assets, so the version has to name a
    # published release, not just a tag.
    kind: githubrelease
    spec:
      owner: spinframework
      repository: containerd-shim-spin
      versionfilter:
        kind: regex/semver
        regex: '^v([0-9]+\.[0-9]+\.[0-9]+)$'
        pattern: "*"
    transformers:
      - trimprefix: v

targets:
  spin_shim_version:
    name: 'SPIN_SHIM_VERSION in containerd-shim-spin/Dockerfile updated to {{ source "spin_shim" }}'
    kind: dockerfile
    spec:
      file: containerd-shim-spin/Dockerfile
      instruction:
        keyword: ARG
        matcher: SPIN_SHIM_VERSION
    sourceid: spin_shim
