---
name: GitHub Actions versions

# Every `uses: owner/action@vN` in the workflows is moved to the newest major
# tag. The tags stay floating majors (v7, not v7.0.1 and not a commit SHA), as
# they are now; digest pinning is off.
autodiscovery:
  crawlers:
    github/action:
      rootdir: .
      digest: false
      # updatecli-action publishes no floating major tag newer than v1 (there
      # is v1 and then only full versions such as v3.11.0), so the major-only
      # filter below would "update" it back to v1. It is pinned to a full tag
      # in autobumper.yml and left alone here.
      ignore:
        - actions:
            "updatecli/updatecli-action": ""
      versionfilter:
        kind: regex
        pattern: '^v[0-9]+$'
