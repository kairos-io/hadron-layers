---
name: AuroraBoot image used to build sysexts

sources:
  auroraboot:
    # The build workflow runs `auroraboot sysext` from this image. Track the
    # newest plain vX.Y.Z tag: releases also publish per-arch tags such as
    # v0.31.0-amd64, and the multi-arch tag can lag behind them, so the
    # strict filter keeps the pin on a tag that exists for both platforms.
    kind: dockerimage
    spec:
      image: quay.io/kairos/auroraboot
      tagfilter: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      versionfilter:
        kind: regex/semver
        regex: '^v([0-9]+\.[0-9]+\.[0-9]+)$'
        pattern: "*"

targets:
  build_workflow:
    name: 'AuroraBoot tag in build.yml updated to {{ source "auroraboot" }}'
    kind: file
    spec:
      file: .github/workflows/build.yml
      matchpattern: 'AURORABOOT_IMAGE: quay\.io/kairos/auroraboot:v[0-9.]+'
      replacepattern: 'AURORABOOT_IMAGE: quay.io/kairos/auroraboot:{{ source "auroraboot" }}'
    sourceid: auroraboot
