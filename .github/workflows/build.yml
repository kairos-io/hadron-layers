name: Build and push layer images

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  # The merge queue runs this workflow on a temporary branch so the required
  # layers-ci check can report. It builds nothing there, see layers-ci below.
  merge_group:
  workflow_dispatch:
# Serialize runs per ref so only one main build runs at a time.
# Pushes to main queue and run in order (cancel-in-progress: false) to avoid
# cache races and older images overwriting newer ones. Pull request runs cancel
# their own superseded runs to save resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. A job that needs more asks for it in its own
# permissions block.
permissions:
  contents: read

jobs:
  # Auto-discover layer directories. Every layer is built on every run — the
  # per-layer GHA cache (scope=<layer>, mode=max) short-circuits work when a
  # layer's inputs are unchanged, so change-detection at the workflow level
  # would only duplicate what BuildKit already does.
  discover:
    name: Discover layers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      build_matrix: ${{ steps.runners.outputs.build_matrix }}
      sysext_skip_layers: ${{ steps.settings.outputs.sysext_skip_layers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test workflow policy
        run: ./.github/workflows/build_test.sh

      - name: Test the autobumper changelog script
        run: ./.github/scripts/autobumper-changelog_test.sh

      # site/build-data_test.sh stubs both docker and gh, so it runs anywhere
      # jq does. It has never been wired to a workflow, which left the
      # releases.json shape asserted only by whoever remembered to run it.
      - name: Test releases.json generation
        run: ./site/build-data_test.sh

      - name: Read publishing settings
        id: settings
        run: |
          ruby -ryaml -rjson -e '
            config = YAML.safe_load_file("publishing.yaml")
            skip_layers = config.dig("publishing", "sysext", "skip") || []
            abort "publishing.sysext.skip must be a list of layer names" unless
              skip_layers.is_a?(Array) && skip_layers.all? { |layer| layer.is_a?(String) }
            puts "sysext_skip_layers=#{JSON.generate(skip_layers)}"
          ' >> "$GITHUB_OUTPUT"

      - name: Enumerate layer directories
        id: discover
        run: |
          # Convention: every top-level directory with a Dockerfile is a layer,
          # and the bake target name matches the directory name.
          MATRIX=$(find . -mindepth 2 -maxdepth 2 -name "Dockerfile" -not -path '*/.*/*' \
            | sed 's|^\./||; s|/Dockerfile$||' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Layers: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      # One build job per layer and arch, each with the runner that
      # .github/runners.yaml gives it.
      - name: Pick runners
        id: runners
        env:
          LAYERS: ${{ steps.discover.outputs.matrix }}
        run: |
          ruby -ryaml -rjson -e '
            cfg = YAML.safe_load_file(".github/runners.yaml")
            layers = JSON.parse(ENV.fetch("LAYERS"))
            heavy = cfg.fetch("heavy_layers")
            unknown = heavy - layers
            abort "runners.yaml heavy_layers names a layer that does not exist: #{unknown.join(", ")}" unless unknown.empty?
            jobs = layers.product(%w[amd64 arm64]).map do |layer, arch|
              kind = heavy.include?(layer) ? "heavy" : "light"
              { "layer" => layer, "arch" => arch, "runner" => cfg.fetch(kind).fetch(arch) }
            end
            puts "build_matrix=#{JSON.generate(jobs)}"
          ' | tee -a "$GITHUB_OUTPUT"

  # Build each layer once per architecture on a NATIVE runner (no QEMU) so the
  # arm64 compile is as fast as amd64. Each (layer, arch) job pushes its image
  # by digest only — no per-arch tag — and the merge job below stitches the two
  # digests into a single multi-arch tag. Because the per-arch images are
  # untagged, nothing intermediate lingers in the registry.
  #
  # Cache is scoped per (layer, arch): amd64 and arm64 now run on separate
  # runners with separate BuildKit instances, so a shared scope would just race.
  # Within a job the smoke test and build share one BuildKit instance and one
  # scope, with the build step as the sole cache-to writer.
  build:
    name: Build ${{ matrix.layer }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: discover
    # The pull request already built exactly this content. The queue does not
    # build it a second time.
    if: github.event_name != 'merge_group'
    # A hung build would hold a 32 core VM for the six hours GitHub allows.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.build_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep this convention in sync with the merge job below.
      - name: Extract software version
        id: version
        env:
          LAYER: ${{ matrix.layer }}
        run: |
          VERSION=$(grep -E '^ARG [A-Z][A-Z_0-9]*_VERSION=' "$LAYER/Dockerfile" \
            | grep -vE '^ARG (HADRON_TOOLCHAIN_VERSION|HADRON_VERSION)=' \
            | head -1 \
            | cut -d= -f2)
          if [[ -z "$VERSION" ]]; then
            echo "Error: no software _VERSION ARG found in $LAYER/Dockerfile"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # Build the Dockerfile's `test` stage and let any RUN in it execute. A
      # non-zero exit fails this job and prevents the build below from running.
      # Now runs natively on this arch, so arm64 gets real test coverage cheaply.
      # Reads the (layer, arch) cache only; the build step is the sole cache-to
      # writer, and the two steps share this job's local BuildKit cache so the
      # stages compiled here are reused by the build step for free.
      - name: Smoke test ${{ matrix.layer }} (${{ matrix.arch }})
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.layer }}
          push: false
          set: |
            *.target=test
            *.output=type=cacheonly
            *.platform=linux/${{ matrix.arch }}
            *.cache-from=type=gha,scope=${{ matrix.layer }}-${{ matrix.arch }}

      # Build the release image for this single arch. On push/tag it is pushed
      # by digest (untagged) so the merge job can assemble a multi-arch tag; on
      # pull_request it is only built (type=cacheonly) to validate without
      # pushing. Sole cache-to writer of the (layer, arch) scope.
      - name: Build ${{ matrix.layer }} (${{ matrix.arch }})
        id: build
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.layer }}
          push: false
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.output=${{ github.event_name != 'pull_request' && format('type=image,name=ghcr.io/kairos-io/hadron-layers/{0},push-by-digest=true,name-canonical=true,push=true', matrix.layer) || format('type=docker,name=hadron-layer-{0}:{1}', matrix.layer, matrix.arch) }}
            *.tags=
            *.cache-from=type=gha,scope=${{ matrix.layer }}-${{ matrix.arch }}
            *.cache-to=type=gha,scope=${{ matrix.layer }}-${{ matrix.arch }},mode=max

      # Persist the pushed image digest so the merge job can reference it.
      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          LAYER: ${{ matrix.layer }}
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          mkdir -p /tmp/digests
          printf '%s' "$METADATA" > /tmp/metadata.json
          digest=$(jq -r --arg t "$LAYER" '.[$t]."containerimage.digest"' /tmp/metadata.json)
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "Error: no containerimage.digest for target $LAYER in bake metadata" >&2
            cat /tmp/metadata.json >&2
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.layer }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Set up ORAS
        if: github.event_name != 'pull_request'
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.0

      # AuroraBoot creates verity metadata but omits signature partitions when
      # no deployment-specific key and certificate are supplied.
      - name: Create unsigned sysext
        if: ${{ !contains(fromJSON(needs.discover.outputs.sysext_skip_layers), matrix.layer) }}
        env:
          ARCH: ${{ matrix.arch }}
          EVENT_NAME: ${{ github.event_name }}
          LAYER: ${{ matrix.layer }}
          METADATA: ${{ steps.build.outputs.metadata }}
          VERSION: ${{ steps.version.outputs.value }}
          REGISTRY: ghcr.io/kairos-io/hadron-layers
          AURORABOOT_IMAGE: quay.io/kairos/auroraboot:v0.30.0
        run: |
          mkdir -p /tmp/sysext
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            source_image="hadron-layer-${LAYER}:${ARCH}"
          else
            digest=$(jq -r --arg t "$LAYER" '.[$t]."containerimage.digest"' <<<"$METADATA")
            if [[ -z "$digest" || "$digest" == "null" ]]; then
              echo "Error: no architecture-specific digest for $LAYER" >&2
              exit 1
            fi
            source_image="${REGISTRY}/${LAYER}@${digest}"
          fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/sysext:/output \
            "$AURORABOOT_IMAGE" sysext \
            --arch "$ARCH" --output /output "$LAYER" "$source_image"
          test -s "/tmp/sysext/${LAYER}.sysext.raw"

      - name: Push sysext artifact
        if: ${{ github.event_name != 'pull_request' && !contains(fromJSON(needs.discover.outputs.sysext_skip_layers), matrix.layer) }}
        working-directory: /tmp/sysext
        env:
          ARCH: ${{ matrix.arch }}
          LAYER: ${{ matrix.layer }}
          VERSION: ${{ steps.version.outputs.value }}
          REGISTRY: ghcr.io/kairos-io/hadron-layers
        run: |
          oras push \
            --artifact-type application/vnd.kairos.sysext.raw \
            "${REGISTRY}/sysext/${LAYER}:${VERSION}-${ARCH}" \
            "${LAYER}.sysext.raw:application/vnd.kairos.sysext.raw"

  # Combine the per-arch digests for each layer into a single multi-arch image
  # tag. Skipped on pull_request (nothing was pushed there).
  merge:
    name: Merge ${{ matrix.layer }} manifest
    runs-on: ubuntu-latest
    needs: [discover, build]
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Extract the primary software version from the Dockerfile.
      # Convention: the first ARG with a default value (ARG NAME=value) that is
      # not the Hadron base/toolchain version (HADRON_TOOLCHAIN_VERSION,
      # HADRON_VERSION) is the image's version tag.
      - name: Extract software version
        id: version
        env:
          LAYER: ${{ matrix.layer }}
        run: |
          VERSION=$(grep -E '^ARG [A-Z][A-Z_0-9]*_VERSION=' "$LAYER/Dockerfile" \
            | grep -vE '^ARG (HADRON_TOOLCHAIN_VERSION|HADRON_VERSION)=' \
            | head -1 \
            | cut -d= -f2)
          if [[ -z "$VERSION" ]]; then
            echo "Error: no _VERSION ARG with a default value found in $LAYER/Dockerfile (or only Hadron base/toolchain versions were present)"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.layer }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          LAYER: ${{ matrix.layer }}
          VERSION: ${{ steps.version.outputs.value }}
          REGISTRY: ghcr.io/kairos-io/hadron-layers
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY/$LAYER:$VERSION" \
            $(printf "$REGISTRY/$LAYER@sha256:%s " *)

      - name: Inspect image
        env:
          LAYER: ${{ matrix.layer }}
          VERSION: ${{ steps.version.outputs.value }}
          REGISTRY: ghcr.io/kairos-io/hadron-layers
        run: docker buildx imagetools inspect "$REGISTRY/$LAYER:$VERSION"

  # The one check to require on main. A matrix has one check per layer and
  # arch, and that list changes whenever a layer is added, so requiring the
  # matrix jobs by name does not hold. Require this job instead: it is green
  # only when discover and every build succeeded, and on a push or tag when
  # every manifest merge succeeded too. The merge jobs are skipped on a pull
  # request on purpose, so a skipped merge counts only there. In the merge
  # queue both build and merge are skipped on purpose: the pull request
  # already built the same content, so the queue only has to report the check.
  layers-ci:
    name: layers-ci
    if: always()
    needs: [discover, build, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          # A jq error must fail this step, never leave $failed empty.
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r --arg event "$EVENT" '
            [to_entries[]
             | select(.value.result != "success"
                      and ((.value.result == "skipped"
                            and ((.key == "merge" and $event == "pull_request")
                                 or ($event == "merge_group" and (.key == "build" or .key == "merge")))) | not))
             | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error title=layers-ci::Not every required job passed: ${failed}"
            exit 1
          fi
