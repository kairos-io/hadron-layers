name: Deploy layers page

## Regenerate the static releases page after the layer build workflow finishes
## a push (main or tag), or on demand. The page consumes releases.json which is
## built fresh from the GHCR package versions API.
on:
  workflow_run:
    workflows: ["Build and push layer images"]
    types:
      - completed
  workflow_dispatch:

## Serialize deploys but never cancel one in-flight — always let a running
## deployment finish so GitHub Pages does not receive a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    ## Rebuild the page after any successful build that published something.
    ## A pull_request run of the build is the only one that does not: it builds
    ## with `push: false` and `type=cacheonly`, so there is nothing new in GHCR
    ## for releases.json to name. Every other trigger pushes.
    ##
    ## This used to require `event == 'push'`, which named one of them. The
    ## build also carries workflow_dispatch, and the daily schedule added for
    ## kairos-io/kairos#5406 is what publishes a bot-merged bump at all, since
    ## an auto-merge queued with GITHUB_TOKEN starts no push run. Both arrive
    ## here as a `workflow_run` whose `.event` is the trigger of the completed
    ## run, so both were skipped and the catalog went on naming the versions of
    ## the last human push (kairos-io/kairos#5447). Excluding pull_request
    ## rather than listing the publishing triggers keeps a trigger added to
    ## build.yml later from stranding the page again.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build releases.json and stage the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          ./site/build-data.sh _site/releases.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
