name: Auto-approve bot PRs

## Approves PRs opened by the automation bots that run against this repo:
## updatecli (ci-robbot, opening PRs from the ci-forks/hadron-layers fork) and
## Renovate (renovate[bot], same-repo branch). All actors are treated
## identically.
##
## Approving is all this does. The merge lives in automerge.yml, which waits
## for "Build and push layer images" to finish green on the PR's head commit.
## It used to be a `gh pr merge --auto --squash` right here, and because this
## runs seconds after the PR opens, before any check has reported, and the
## ruleset on main requires a review but no status check, gh found the PR in a
## CLEAN merge state and merged it on the spot. #91 put a ZFS_VERSION that
## OpenZFS never released on main that way. Do not merge from this workflow.
##
## Uses pull_request_target so the workflow gets a write-scoped token even when
## the PR head is a fork (the case for updatecli via ci-forks). Safe because we
## gate on the PR author allow-list below and never check out PR code.
on:
  pull_request_target:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

permissions:
  pull-requests: write

jobs:
  autoapprove:
    name: Auto-approve bot PR
    runs-on: ubuntu-latest
    ## Gate on the PR author (pull_request.user.login), NOT github.actor —
    ## with pull_request_target the actor is who last touched the PR event,
    ## which an attacker could game by adding a commit. The PR author is the
    ## identity that opened the PR and cannot be spoofed by a later push.
    if: |
      github.event.pull_request.user.login == 'github-actions[bot]' ||
      github.event.pull_request.user.login == 'ci-robbot' ||
      github.event.pull_request.user.login == 'renovate[bot]'
    steps:
      - name: Approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
